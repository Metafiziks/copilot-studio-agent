displayName: OL Memory Agent
schemaName: olk_OLMemoryAgent
accessControlPolicy: GroupMembership
authenticationMode: Integrated
authenticationTrigger: Always
configuration:
  recognizer:
    kind: CLICopilotRecognizer

  agentSettings:
    model:
      series: Sonnet46

    instructions:
      segments:
        - kind: StaticSegment
          value: "Answer questions using only the documents you retrieve from your knowledge sources. Say which document each answer comes from. If the documents do not contain the answer, say so plainly instead of guessing. Remember the user's stated preferences and apply them in later conversations."

    enableMemory: true

  authoringModel: CliCopilot

template: cliagent-1.0.0
language: 1033
