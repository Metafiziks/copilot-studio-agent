name: CI

# Unit tests and shell syntax checks. No tenant access and no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f"
          done
