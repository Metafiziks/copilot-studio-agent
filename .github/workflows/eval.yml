name: Run evals

# On-demand evaluation of the deployed agent. The agent retrieves SharePoint content AS THE SIGNED-IN
# USER, so the evals need a real user's sign-in, not an app identity, and that user must hold a
# SharePoint-bearing license (an unlicensed user's searches fail and every answer is "not found").
# This job reuses a cached sign-in stored in the EVAL_TOKEN_CACHE secret:
#
#   1. Sign in locally as the licensed test user, with a cache of its own:
#        AGENT_TOKEN_CACHE=.build/token_cache_eval.json .venv-eval/bin/python scripts/run_evals.py --limit 1
#   2. Store the cache:      gh secret set EVAL_TOKEN_CACHE --env dev < .build/token_cache_eval.json
#
# AGENT_ENVIRONMENT_ID / AGENT_SCHEMA_NAME must point at an agent whose knowledge site holds the SAMPLE
# corpus (KB_ACCESS_MODE=sample), the one tests/eval_cases.json asks about, and the user must be a
# member of that site and have the agent shared with them (Can use). The run includes the two-turn
# memory case, which writes a preference into that user's memory.
#
# The cache holds a refresh token for that user. It stops working after about 90 days idle, when the
# password changes, or if conditional access (for example MFA on every sign-in) blocks it; the job then
# fails with a message saying so rather than waiting for a human.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Run only the first N cases (blank = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  evals:
    name: Evaluate the agent
    runs-on: ubuntu-latest
    environment: dev
    env:
      EVAL_CLIENT_ID: ${{ vars.EVAL_CLIENT_ID }}
      EVAL_TENANT_ID: ${{ vars.EVAL_TENANT_ID }}
      AGENT_ENVIRONMENT_ID: ${{ vars.AGENT_ENVIRONMENT_ID }}
      AGENT_SCHEMA_NAME: ${{ vars.AGENT_SCHEMA_NAME }}
      EVAL_TOKEN_CACHE: ${{ secrets.EVAL_TOKEN_CACHE }}
      LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v4

      - name: Mask tenant details in the log
        # Variables are not masked by default and this repository's logs are public.
        run: bash scripts/mask_ci_values.sh EVAL_CLIENT_ID EVAL_TENANT_ID AGENT_ENVIRONMENT_ID

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configuration
        run: |
          missing=""
          for v in EVAL_CLIENT_ID EVAL_TENANT_ID AGENT_ENVIRONMENT_ID AGENT_SCHEMA_NAME EVAL_TOKEN_CACHE; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the 'dev' environment:$missing. See the comments at the top of this workflow."
            exit 1
          fi
          mkdir -p .build
          printf '%s' "$EVAL_TOKEN_CACHE" > .build/token_cache.json
          chmod 600 .build/token_cache.json

      - name: Install the Agents SDK
        run: python -m pip install microsoft-agents-copilotstudio-client msal

      - name: Run the evals
        run: python scripts/run_evals.py ${LIMIT:+--limit "$LIMIT"} --output eval_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
          if-no-files-found: ignore
